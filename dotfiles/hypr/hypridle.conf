general {
    lock_cmd = pidof hyprlock || hyprlock
}

listener {
    timeout = 900                                   # 15min
    on-timeout = loginctl lock-session              # lock screen when timeout has passed
}

listener {
    timeout = 18000                                              # 5hr
    on-timeout = loginctl kill-session $XDG_SESSION_ID           # logout when timeout has passed
}
