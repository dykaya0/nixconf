general {
    lock_cmd = pidof hyprlock || hyprlock
}

listener {
    timeout = 900                                   # 15min
    on-timeout = loginctl lock-session              # lock screen when timeout has passed
}

listener {
    timeout = 1800                                              # 30min
    on-timeout = loginctl kill-session $XDG_SESSION_ID        # lock screen when timeout has passed
}
